<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>춤추전국시대 LIVE 12강 대진표</title>
<style>
:root{--red:#ef1a1a;--white:#f5f0e9}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif}
body{display:grid;place-items:center}
/* Chrome/Edge 호환: calc() 안에서 곱셈/나눗셈을 쓰지 않는다. */
.stage{position:relative;width:min(100vw,177.683vh);aspect-ratio:1672/941;max-height:100vh;overflow:hidden;container-type:inline-size;background:#050505}
.bracket-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;z-index:0;user-select:none;-webkit-user-drag:none}
.slot{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:1.15cqw;isolation:isolate}
.logo{position:absolute;inset:-10%;background-size:contain;background-position:center;background-repeat:no-repeat;opacity:.44;filter:grayscale(1) contrast(1.15);z-index:0}
.slot::after{content:"";position:absolute;inset:3%;background:radial-gradient(circle at 50% 48%,rgba(0,0,0,.03),rgba(0,0,0,.54) 80%);z-index:1}

.player{position:absolute;z-index:2;inset:0;width:100%;height:100%;display:grid;grid-template-rows:auto auto;align-content:center;justify-items:center;text-align:center;row-gap:.34cqw;padding:0 4.5%;transform:translateY(.05cqw)}

.school{width:100%;font-weight:800;font-size:clamp(9px,.73cqw,15px);line-height:1.12;letter-spacing:-.025em;color:rgba(255,248,240,.94);text-shadow:0 2px 8px #000;white-space:nowrap;text-align:center;overflow:visible}
.school.long{font-size:clamp(8px,.62cqw,13px);letter-spacing:-.04em}

.name{width:100%;font-family:"Arial Black","Malgun Gothic",sans-serif;font-size:clamp(24px,2.62cqw,52px);font-weight:950;line-height:1;letter-spacing:-.07em;color:#f7f0e6;text-shadow:0 2px 1px #250000,0 3px 12px #000;white-space:nowrap;text-align:center}
.slot.empty .player{display:none}
.slot.changed .player{animation:slotPop .62s cubic-bezier(.2,.9,.25,1)}
.slot.changed::before{content:"";position:absolute;inset:4%;z-index:3;border:2px solid rgba(255,34,34,.92);box-shadow:0 0 18px rgba(255,0,0,.85),inset 0 0 12px rgba(255,0,0,.4);animation:flash .75s ease-out forwards}
@keyframes slotPop{0%{opacity:0;transform:scale(.74)}55%{opacity:1;transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.s0{left:6.75%;top:38.35%;width:14.55%;height:15.35%}.s1{left:32.52%;top:38.35%;width:14.55%;height:15.35%}
.s2{left:51.66%;top:38.35%;width:14.55%;height:15.35%}.s3{left:77.38%;top:38.35%;width:14.55%;height:15.35%}
.s4{left:6.75%;top:57.35%;width:14.55%;height:15.35%}.s5{left:32.52%;top:57.35%;width:14.55%;height:15.35%}
.s6{left:51.66%;top:57.35%;width:14.55%;height:15.35%}.s7{left:77.38%;top:57.35%;width:14.55%;height:15.35%}
.s8{left:6.75%;top:76.25%;width:14.55%;height:15.35%}.s9{left:32.52%;top:76.25%;width:14.55%;height:15.35%}
.s10{left:51.66%;top:76.25%;width:14.55%;height:15.35%}.s11{left:77.38%;top:76.25%;width:14.55%;height:15.35%}
.draw-layer{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 43%,rgba(130,0,0,.34),rgba(0,0,0,.90) 64%),rgba(0,0,0,.64);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .24s ease}
.stage.mode-draw .draw-layer{opacity:1}
.draw-wrap{width:61%;max-width:1030px;position:relative;text-align:center}
.draw-kicker{font-size:clamp(11px,1.25cqw,23px);font-weight:900;letter-spacing:.22em;color:#ee2727;margin-bottom:1.15cqw;text-shadow:0 0 13px rgba(255,0,0,.45)}
.draw-card{position:relative;width:100%;aspect-ratio:1.65;border:1px solid rgba(255,35,35,.8);background:linear-gradient(135deg,rgba(255,0,0,.08),transparent 30%),linear-gradient(0deg,rgba(7,7,7,.96),rgba(15,15,15,.96));box-shadow:0 0 0 3px rgba(80,0,0,.45),0 0 35px rgba(255,0,0,.18),inset 0 0 55px rgba(0,0,0,.8);overflow:hidden;clip-path:polygon(2.6% 0,97.4% 0,100% 7%,100% 93%,97.4% 100%,2.6% 100%,0 93%,0 7%);transform-style:preserve-3d}
.draw-card::before{content:"";position:absolute;inset:1.5%;border:1px solid rgba(255,40,40,.58);clip-path:inherit;z-index:4}
.draw-card::after{content:"";position:absolute;inset:0;background-image:linear-gradient(115deg,transparent 0 46%,rgba(255,30,30,.08) 46.5% 47%,transparent 47.5%),radial-gradient(circle at 15% 80%,rgba(255,0,0,.18),transparent 23%);z-index:1}
.draw-logo{position:absolute;inset:4%;background-size:contain;background-repeat:no-repeat;background-position:center;opacity:.50;filter:grayscale(1) contrast(1.15);z-index:1}
.official-eyes{position:absolute;top:15.5%;left:50%;transform:translateX(-50%);width:20%;height:auto;z-index:5;filter:drop-shadow(0 0 8px rgba(255,0,0,.8)) drop-shadow(0 0 18px rgba(255,0,0,.45));pointer-events:none}
.draw-content{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:6.5%}
.draw-school{font-size:clamp(14px,1.45cqw,28px);font-weight:850;color:#f4eee7;margin-bottom:1.35cqw;text-shadow:0 3px 10px #000;white-space:nowrap}
.draw-name{font-family:"Arial Black","Malgun Gothic",sans-serif;font-size:clamp(42px,5.4cqw,105px);font-weight:950;letter-spacing:-.07em;line-height:1;color:#f4eee5;text-shadow:0 4px 2px #320000,0 6px 24px #000;white-space:nowrap;text-align:center}
.reveal{animation:revealCard .8s cubic-bezier(.12,.82,.25,1)}
@keyframes revealCard{0%{opacity:0;transform:perspective(900px) rotateY(-85deg) scale(.75)}55%{opacity:1;transform:perspective(900px) rotateY(7deg) scale(1.04)}100%{transform:perspective(900px) rotateY(0) scale(1)}}
.netbadge{position:absolute;right:.7cqw;bottom:.45cqw;z-index:50;font-size:clamp(7px,.45cqw,10px);color:rgba(255,255,255,.16);letter-spacing:.08em}
.asset-error{display:none;position:absolute;inset:0;z-index:80;place-items:center;background:#050505;color:#f44;font-weight:900;font-size:2vw;text-align:center}.asset-error.on{display:grid}
</style>
</head>
<body>
<main id="stage" class="stage">
  <img id="bracketBg" class="bracket-bg" src="/static/bracket.png?v=20260813-3" alt="12강 대진표 배경">
  <div id="slots"></div>
  <div class="draw-layer">
    <div class="draw-wrap">
      <div class="draw-kicker">12강 PARTICIPANT DRAW</div>
      <div id="drawCard" class="draw-card">
        <div id="drawLogo" class="draw-logo"></div>
        <img class="official-eyes" src="/static/brand_eyes.svg?v=20260813-3" alt="춤추전국시대 붉은 눈 로고">
        <div class="draw-content"><div id="drawSchool" class="draw-school"></div><div id="drawName" class="draw-name"></div></div>
      </div>
    </div>
  </div>
  <div class="netbadge" id="netbadge">LIVE RENDER · V3</div>
  <div id="assetErr" class="asset-error">BACKGROUND ASSET LOAD ERROR<br><small>/static/bracket.png</small></div>
</main>
<script>
const P=[{"id":"hongjoi","name":"홍조이","school":"백석예술대학교","central":false,"logo":"/static/logos/hongjoi.png"},{"id":"kimkitae","name":"김기태","school":"상명대학교 미래교육원","central":false,"logo":"/static/logos/kimkitae.png"},{"id":"kimyumin","name":"김유민","school":"정화예술대학교","central":false,"logo":"/static/logos/kimyumin.png"},{"id":"sinbi","name":"신비","school":"서울호서예술실용전문학교","central":false,"logo":"/static/logos/sinbi.png"},{"id":"choigain","name":"최가인","school":"백제예술대학교","central":false,"logo":"/static/logos/choigain.png"},{"id":"choiseungwoo","name":"최승우","school":"동신대학교","central":false,"logo":"/static/logos/choiseungwoo.png"},{"id":"parksiha","name":"박시하","school":"한양대학교 미래인재교육원","central":false,"logo":"/static/logos/parksiha.png"},{"id":"jungseeun","name":"정세은","school":"국민대학교 미래인재교육원","central":false,"logo":"/static/logos/jungseeun.png"},{"id":"parkjinwoo","name":"박진우","school":"서울대학교","central":false,"logo":"/static/logos/parkjinwoo.png"},{"id":"gohyeju","name":"고혜주","school":"한국외국어대학교","central":false,"logo":"/static/logos/gohyeju.png"},{"id":"wiseongjae","name":"위성재","school":"서울시립대학교","central":false,"logo":"/static/logos/wiseongjae.png"},{"id":"kimjinseo","name":"김진서","school":"중앙대학교","central":true,"logo":"/static/logos/kimjinseo.png"}];
const byId=Object.fromEntries(P.map(x=>[x.id,x]));const slots=document.getElementById('slots');let prev=null,lastPick=null;
for(let i=0;i<12;i++){const d=document.createElement('div');d.className='slot empty s'+i;d.innerHTML='<div class="logo"></div><div class="player"><div class="school"></div><div class="name"></div></div>';slots.appendChild(d)}
const bracketBg=document.getElementById('bracketBg');bracketBg.addEventListener('error',()=>document.getElementById('assetErr').classList.add('on'));bracketBg.addEventListener('load',()=>document.getElementById('assetErr').classList.remove('on'));
function render(s){const stage=document.getElementById('stage');stage.classList.toggle('mode-draw',s.mode==='draw'&&s.current_pick);const flat=[];s.matches.forEach(m=>flat.push(m[0]||null,m[1]||null));document.querySelectorAll('.slot').forEach((el,i)=>{const id=flat[i],old=prev?prev.flat[i]:null;el.classList.toggle('empty',!id);el.classList.remove('changed');if(id){const p=byId[id];el.querySelector('.school').textContent=p.school;const schoolEl=el.querySelector('.school');schoolEl.classList.toggle('long',p.school.length>=12);el.querySelector('.name').textContent=p.name;el.querySelector('.logo').style.backgroundImage=`url(${p.logo}?v=2)`;if(id!==old){void el.offsetWidth;el.classList.add('changed')}}});if(s.current_pick){const p=byId[s.current_pick];document.getElementById('drawSchool').textContent=p.school;document.getElementById('drawName').textContent=p.name;document.getElementById('drawLogo').style.backgroundImage=`url(${p.logo}?v=2)`;if(lastPick!==s.current_pick){const c=document.getElementById('drawCard');c.classList.remove('reveal');void c.offsetWidth;c.classList.add('reveal');lastPick=s.current_pick}}prev={flat}}
async function poll(){try{const r=await fetch('/api/state?ts='+Date.now(),{cache:'no-store'}),s=await r.json();render(s);document.getElementById('netbadge').textContent='LIVE RENDER · V3 · '+new Date().toLocaleTimeString('ko-KR',{hour12:false})}catch(e){document.getElementById('netbadge').textContent='RECONNECTING…'}setTimeout(poll,420)}poll();
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()});
</script>
</body></html>
