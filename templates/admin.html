<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>춤추전국시대 운영자 콘솔</title><style>:root{--r:#ef1a1a;--txt:#f4f1eb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#120202,#070707 170px);color:var(--txt);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}button,select,input{font:inherit}.wrap{max-width:720px;margin:auto;padding:18px 14px 80px}.head{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 2px 16px}.head h1{font-size:22px;margin:0;letter-spacing:-.05em}.head small{color:#c82b2b}.panel{background:rgba(16,16,16,.96);border:1px solid #2a1818;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 14px 30px rgba(0,0,0,.22)}.title{font-size:12px;color:#ee3939;font-weight:900;letter-spacing:.12em;margin-bottom:10px}.btn{border:1px solid #3a2323;background:#191111;color:white;border-radius:12px;padding:13px 12px;font-weight:850;min-height:48px}.btn:active{transform:scale(.985)}.btn.red{background:linear-gradient(#c91414,#8d0909);border-color:#f12b2b}.btn.ghost{background:#111;border-color:#333}.btn.warn{background:#2a2110;border-color:#74540d;color:#ffd37b}.btn.green{background:#0c2a1d;border-color:#1f8054;color:#92f6c6}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{display:flex;gap:7px;flex-wrap:wrap}.pill{font-size:12px;padding:6px 9px;border-radius:999px;background:#191919;border:1px solid #303030;color:#bbb}.pill.current{border-color:#f12626;color:#fff;background:#3a0d0d}.pill.held{border-color:#8a651a;color:#f3c96d}.pill.matched{opacity:.42}.current-card{border:1px solid #642121;border-radius:13px;background:radial-gradient(circle at 20% 10%,rgba(255,0,0,.15),transparent 35%),#0c0c0c;padding:16px;text-align:center;margin-bottom:10px;min-height:102px;display:flex;flex-direction:column;justify-content:center}.current-card b{font-size:30px;letter-spacing:-.07em}.current-card span{font-size:13px;color:#cfc7c2;margin-bottom:3px}select{width:100%;background:#111;color:#fff;border:1px solid #393939;border-radius:11px;padding:13px;min-height:48px}.match{display:grid;grid-template-columns:38px 1fr 1fr;gap:7px;align-items:center;margin:7px 0}.match strong{font-size:12px;color:#e03232}.note{font-size:12px;line-height:1.5;color:#999;margin-top:8px}.login{position:fixed;inset:0;background:#050505;z-index:100;display:grid;place-items:center}.loginbox{width:min(88vw,360px);padding:24px;border:1px solid #562020;background:#0d0d0d;border-radius:18px;text-align:center}.login h2{margin:0 0 7px}.login input{width:100%;padding:14px;background:#171717;border:1px solid #444;color:white;border-radius:11px;text-align:center;font-size:22px;letter-spacing:.2em;margin:12px 0}.login .err{height:18px;color:#e75555;font-size:12px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#eee;color:#111;padding:10px 15px;border-radius:999px;font-size:13px;font-weight:800;opacity:0;transition:.2s;z-index:200}.toast.on{opacity:1}.mini{font-size:11px;color:#777;margin-top:5px}.danger{border-color:#5d1717!important;color:#f48080!important}.heldlist{display:flex;flex-wrap:wrap;gap:7px}.heldbtn{border:1px solid #6d531a;background:#221b0b;color:#ffd879;border-radius:9px;padding:9px 10px;font-weight:800}</style></head><body><div id="login" class="login"><div class="loginbox"><h2>운영자 콘솔</h2><div class="note">춤추전국시대 LIVE 12강</div><input id="pin" inputmode="numeric" maxlength="8" placeholder="PIN"><button class="btn red" style="width:100%" onclick="login()">입장</button><div id="err" class="err"></div></div></div><div class="wrap"><div class="head"><div><small>OF ALL THINGS DANCE</small><h1>12강 LIVE CONTROL</h1></div><button class="btn ghost" style="min-height:38px;padding:8px 10px" onclick="refresh()">새로고침</button></div><div class="panel"><div class="title">DISPLAY CONTROL</div><div class="grid2"><button class="btn ghost" onclick="act('show_bracket')">대진표 화면</button><button class="btn ghost" onclick="act('show_draw')">현재 제비카드</button></div><div class="note">TV에는 /display만 띄워두고 여기서 조작하면 약 0.5초 안에 반영됩니다.</div></div><div class="panel"><div class="title">01 · 제비 뽑기</div><div id="current" class="current-card"><span>현재 지목</span><b>대기 중</b></div><div class="grid2"><button class="btn red" onclick="act('draw_random')">랜덤 제비 뽑기</button><button class="btn warn" onclick="act('hold_current')">지원자 없음 · 보류</button></div><div style="height:9px"></div><select id="manualPick"></select><button class="btn ghost" style="width:100%;margin-top:7px" onclick="manualPick()">선택한 참가자 수동 공개</button><div id="heldArea" style="margin-top:12px"></div></div><div class="panel"><div class="title">02 · 상대 선택 & 대진 확정</div><select id="opponent"></select><button class="btn red" style="width:100%;margin-top:8px" onclick="confirmMatch()">현재 참가자와 대진 확정</button><div class="note">확정되는 순서대로 MATCH 1 → 6에 자동 반영됩니다.</div></div><div class="panel"><div class="title">03 · 중앙대 마지막 자동 매칭</div><button class="btn green" style="width:100%" onclick="act('auto_central')">마지막 미매칭 참가자 × 김진서 자동 매칭</button><div class="note">중앙대 김진서는 제비/상대 후보에서 제외됩니다.</div></div><div class="panel"><div class="title">LIVE MATCHES · 수정용</div><div id="matches"></div><button class="btn ghost" style="width:100%;margin-top:7px" onclick="manualSave()">수정 내용 저장</button></div><div class="panel"><div class="title">참가자 상태</div><div id="status" class="status"></div></div><div class="panel"><div class="title">SAFETY</div><div class="grid2"><button class="btn ghost" onclick="act('undo')">↶ 마지막 작업 취소</button><button class="btn ghost danger" onclick="resetAll()">전체 초기화</button></div></div><button class="btn ghost" style="width:100%;margin:0 0 10px" onclick="restoreBackup()">브라우저 백업으로 서버 상태 복구</button><div class="mini" id="conn"></div></div><div id="toast" class="toast"></div>
<script>
const P=[{"id":"hongjoi","name":"홍조이","school":"백석예술대학교","central":false,"logo":"/static/logos/hongjoi.png"},{"id":"kimkitae","name":"김기태","school":"상명대학교 미래교육원","central":false,"logo":"/static/logos/kimkitae.png"},{"id":"kimyumin","name":"김유민","school":"정화예술대학교","central":false,"logo":"/static/logos/kimyumin.png"},{"id":"sinbi","name":"신비","school":"서울호서예술실용전문학교","central":false,"logo":"/static/logos/sinbi.png"},{"id":"choigain","name":"최가인","school":"백제예술대학교","central":false,"logo":"/static/logos/choigain.png"},{"id":"choiseungwoo","name":"최승우","school":"동신대학교","central":false,"logo":"/static/logos/choiseungwoo.png"},{"id":"parksiha","name":"박시하","school":"한양대학교 미래인재교육원","central":false,"logo":"/static/logos/parksiha.png"},{"id":"jungseeun","name":"정세은","school":"국민대학교 미래인재교육원","central":false,"logo":"/static/logos/jungseeun.png"},{"id":"parkjinwoo","name":"박진우","school":"서울대학교","central":false,"logo":"/static/logos/parkjinwoo.png"},{"id":"gohyeju","name":"고혜주","school":"한국외국어대학교","central":false,"logo":"/static/logos/gohyeju.png"},{"id":"wiseongjae","name":"위성재","school":"서울시립대학교","central":false,"logo":"/static/logos/wiseongjae.png"},{"id":"kimjinseo","name":"김진서","school":"중앙대학교","central":true,"logo":"/static/logos/kimjinseo.png"}],byId=Object.fromEntries(P.map(p=>[p.id,p]));
let S=null,PIN=sessionStorage.getItem('oatd_pin')||'',lastRevision=-1,pollBusy=false,actionBusy=false,lastCurrentPick=null;
const opp=document.getElementById('opponent'),manual=document.getElementById('manualPick');
if(PIN)document.getElementById('login').classList.add('hidden');
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1700)}
async function login(){PIN=document.getElementById('pin').value.trim();try{const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-PIN':PIN},body:'{}'});if(!r.ok)throw 0;sessionStorage.setItem('oatd_pin',PIN);document.getElementById('login').classList.add('hidden');refreshNow()}catch(e){document.getElementById('err').textContent='PIN을 확인해주세요.'}}
function backupState(){if(!S)return;try{localStorage.setItem('oatd_state_backup',JSON.stringify({savedAt:Date.now(),state:S}));}catch(e){}}
async function api(body){if(actionBusy)return;actionBusy=true;try{const r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-PIN':PIN},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(r.status===401){sessionStorage.removeItem('oatd_pin');location.reload();return}if(!r.ok){toast(j.error||'처리 실패');return}S=j;lastRevision=j.revision;render(true);backupState();return j}catch(e){toast('네트워크 확인 필요')}finally{actionBusy=false}}
function act(action,extra={}){return api({action,...extra})}
async function fetchState(force=false){if(pollBusy||actionBusy)return;pollBusy=true;try{const r=await fetch('/api/state?ts='+Date.now(),{cache:'no-store'});const j=await r.json();if(force||j.revision!==lastRevision){S=j;lastRevision=j.revision;render(force);backupState()}document.getElementById('conn').textContent='연결됨 · '+(j.build||'')+' · '+new Date().toLocaleTimeString('ko-KR')}catch(e){document.getElementById('conn').textContent='연결 확인 필요'}finally{pollBusy=false}}
async function refresh(){await fetchState(true)} async function refreshNow(){await fetchState(true)}
function usedSet(){return new Set((S?.matches||[]).flat().filter(Boolean))}
function optionSignature(arr,ph){return ph+'|'+arr.map(p=>p.id).join(',')}
function syncSelect(el,arr,ph,desired){const sig=optionSignature(arr,ph);if(el.dataset.sig!==sig){const keep=desired??el.value;el.innerHTML=`<option value="">${ph}</option>`+arr.map(p=>`<option value="${p.id}">${p.name} · ${p.school}</option>`).join('');el.dataset.sig=sig;if(keep&&arr.some(p=>p.id===keep))el.value=keep}}
function render(force=false){if(!S)return;const used=usedSet(),cur=S.current_pick?byId[S.current_pick]:null,cc=document.getElementById('current');cc.innerHTML=cur?`<span>${cur.school}</span><b>${cur.name}</b>`:'<span>현재 지목</span><b>대기 중</b>';const avail=P.filter(p=>!p.central&&!used.has(p.id)&&p.id!==S.current_pick);syncSelect(manual,avail,'참가자 선택',manual.value);const changed=lastCurrentPick!==S.current_pick;syncSelect(opp,avail,cur?'상대 참가자 선택':'먼저 제비를 뽑아주세요',changed?'':opp.value);if(!cur)opp.value='';lastCurrentPick=S.current_pick;const held=S.held||[];document.getElementById('heldArea').innerHTML=held.length?'<div class="title" style="margin:0 0 7px;color:#d4a93d">보류 참가자 다시 호출</div><div class="heldlist">'+held.filter(id=>!used.has(id)&&id!==S.current_pick).map(id=>`<button class="heldbtn" onclick="act('call_held',{participant:'${id}'})">${byId[id].name}</button>`).join('')+'</div>':'';document.getElementById('status').innerHTML=P.map(p=>{let c='',t='대기';if(used.has(p.id)){c='matched';t='매칭'}else if(p.id===S.current_pick){c='current';t='현재'}else if(held.includes(p.id)){c='held';t='보류'}else if(p.central)t='중앙대(자동)';return `<span class="pill ${c}">${p.name} · ${t}</span>`}).join('');document.getElementById('matches').innerHTML=S.matches.map((m,i)=>`<div class="match"><strong>M${i+1}</strong><select data-mi="${i}" data-side="0">${opts(m[0])}</select><select data-mi="${i}" data-side="1">${opts(m[1])}</select></div>`).join('')}
function fillSel(id,arr,ph){syncSelect(document.getElementById(id),arr,ph,document.getElementById(id).value)}
function opts(sel){return '<option value="">—</option>'+P.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${p.name}</option>`).join('')}
function manualPick(){const id=manual.value;if(!id)return toast('참가자를 선택해주세요.');act('manual_pick',{participant:id})}
function confirmMatch(){if(!S?.current_pick)return toast('먼저 참가자를 공개해주세요.');const id=opp.value;if(!id)return toast('상대를 선택해주세요.');act('confirm_match',{opponent:id})}
function manualSave(){const matches=Array.from({length:6},()=>[null,null]);document.querySelectorAll('#matches select').forEach(x=>matches[+x.dataset.mi][+x.dataset.side]=x.value||null);api({action:'manual_matches',matches})}
function restoreBackup(){try{const raw=localStorage.getItem('oatd_state_backup');if(!raw)return toast('저장된 브라우저 백업이 없습니다.');const b=JSON.parse(raw);if(confirm('브라우저의 마지막 대진 상태로 서버를 복구할까요?'))api({action:'restore_state',state:b.state})}catch(e){toast('백업을 읽을 수 없습니다.')}}
function resetAll(){if(confirm('대진/보류 기록을 전부 초기화할까요?')&&confirm('정말 초기화할까요?'))act('reset')}
async function poll(){await fetchState(false);setTimeout(poll,900)}
refreshNow();poll();
</script></body></html>
